map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name api.loopin.co.kr;

    # Let's Encrypt 인증서 발급/갱신용 webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 HTTP 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.loopin.co.kr;

    ssl_certificate     /etc/letsencrypt/live/api.loopin.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.loopin.co.kr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 알려진 취약점 스캔 경로 차단 (PHPUnit, ThinkPHP, WordPress 등) ──
    location ~* (eval-stdin\.php|invokefunction|call_user_func_array|\.env$|wp-login|wp-admin|phpinfo|phpmyadmin|\.git|\.svn) {
        access_log off;
        return 444;
    }

    # ── PHP/ASP/CGI 등 비관련 확장자 차단 ──
    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        access_log off;
        return 444;
    }

    # ── 악성 봇 User-Agent 차단 ──
    if ($http_user_agent ~* (zgrab|nuclei|masscan|nmap|nikto|sqlmap|dirbuster|gobuster|scanner)) {
        return 444;
    }

    # ── 내부 전용 경로 외부 차단 ──
    # actuator: 메트릭(외부 호출 uri 라벨 등)과 헬스는 내부 전용이다. Alloy는 loopin-app:8080에서 직접 수집하고
    # deploy.sh 헬스체크는 컨테이너 안에서 호출하므로 nginx를 거치지 않는다.
    location ^~ /actuator {
        return 404;
    }

    # /api/test/: 운영 점검용 임시 엔드포인트(Sentry 연동 테스트 등) — 서버 안(docker exec)에서만 호출한다.
    location ^~ /api/test/ {
        return 404;
    }

    # SSE - 연결 유지가 필요하므로 limit_conn 제외
    location /rest-api/v1/sse/ {
        limit_req zone=api_limit burst=10;

        proxy_pass         http://loopin-app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # 인증 엔드포인트
    location ~ ^/rest-api/v1/auth/(login|signup-login|refresh-token)$ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass         http://loopin-app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    3600s;
    }

    # 일반 API
    location / {
        limit_req  zone=api_limit  burst=50 nodelay;
        limit_conn conn_limit 30;

        proxy_pass         http://loopin-app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # WebSocket support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    3600s;
    }
}
